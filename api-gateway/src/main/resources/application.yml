server:
  port: 9090

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      routes:

        - id: patient-service
          uri: http://patient-service:8080
          predicates:
            - Path=/api/v1/patients/**
        - id: appointment-service
          uri: http://appointment-service:8081
          predicates:
            - Path=/api/v1/appointments/**
        - id: auth-service
          uri: http://auth-service:8082
          predicates:
            - Path=/api/v1/auth/**


management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
      endpoint:
        gateway:
          enabled: true

logging:
  level:
    root: INFO
    org.springframework.security: DEBUG

jwt:
  secret: my-super-secret-key-for-development-only-1234567890