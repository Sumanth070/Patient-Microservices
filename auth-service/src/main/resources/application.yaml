server:
  port: 8082

spring:
  application:
    name: auth-service

  datasource:
    url: jdbc:postgresql://auth-db:5432/auth_db
    username: auth
    password: auth
    driver-class-name: org.postgresql.Driver

    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect

logging:
  level:
    root: INFO
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway,metrics,prometheus

  endpoint:
    gateway:
      enabled: true
    health:
      show-details: always

  metrics:
    tags:
      application: ${spring.application.name}

  oltp:
    tracing:
      endpoint: http://tempo:4318/v1/traces

jwt:
  secret: my-super-secret-key-for-development-only-1234567890
  access-token-expiration: 3600000
  refresh-token-expiration: 604800000