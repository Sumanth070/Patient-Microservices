services:

  patient-db:
    image: mysql:8
    container_name: patient-db
    restart: always
    environment:
      MYSQL_DATABASE: patient_db
      MYSQL_ROOT_PASSWORD: ${PATIENT_DB_ROOT_PASSWORD}
      MYSQL_USER: patient
      MYSQL_PASSWORD: ${PATIENT_DB_PASSWORD}
    volumes:
      - patient_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD","mysqladmin","ping","-h","localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - microservices-network


  appointment-db:
    image: mysql:8
    container_name: appointment-db
    restart: always
    environment:
      MYSQL_DATABASE: appointment_db
      MYSQL_ROOT_PASSWORD: ${APPOINTMENT_DB_ROOT_PASSWORD}
      MYSQL_USER: appointment
      MYSQL_PASSWORD: ${APPOINTMENT_DB_PASSWORD}
    volumes:
      - appointment_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD","mysqladmin","ping","-h","localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - microservices-network

  template-db:
    image: postgres:14
    container_name: template-db
    restart: always
    environment:
      POSTGRES_DB: template_db
      POSTGRES_USER: template
      POSTGRES_PASSWORD: template123
    volumes:
      - template_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U template -d template_db" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - microservices-network


  auth-db:
    image: postgres:16
    container_name: auth-db
    restart: always
    environment:
      POSTGRES_DB: auth_db
      POSTGRES_USER: auth
      POSTGRES_PASSWORD: ${AUTH_DB_PASSWORD}
    volumes:
      - auth_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U auth -d auth_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - microservices-network


  localstack:
    image: localstack/localstack:3.0
    container_name: localstack
    ports:
      - "4566:4566"
    environment:
      - SERVICES=sqs,sns
      - AWS_DEFAULT_REGION=us-east-1
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
      - LOCALSTACK_ACKNOWLEDGE_ACCOUNT_REQUIREMENT=1
    volumes:
      - ./localstack/init:/etc/localstack/init/ready.d
      - ./policy.json:/opt/code/policy.json
      - ./redrive-policy.json:/opt/code/redrive-policy.json
      - "/var/run/docker.sock:/var/run/docker.sock"
    networks:
      - microservices-network


  patient-service:
    image: patient-service:1.1
    container_name: patient-service
    depends_on:
      patient-db:
        condition: service_healthy
    environment:
      OTEL_SERVICE_NAME:
      SPRING_DATASOURCE_URL: ${PATIENT_DB_URL}
      SPRING_DATASOURCE_USERNAME: patient
      SPRING_DATASOURCE_PASSWORD: ${PATIENT_DB_PASSWORD}
    restart: always
    networks:
      - microservices-network


  appointment-service:
    image: appointment-service:1.1
    container_name: appointment-service
    depends_on:
      appointment-db:
        condition: service_healthy
    environment:
      OTEL_SERVICE_NAME:
      SPRING_DATASOURCE_URL: ${APPOINTMENT_DB_URL}
      SPRING_DATASOURCE_USERNAME: appointment
      SPRING_DATASOURCE_PASSWORD: ${APPOINTMENT_DB_PASSWORD}
    restart: always
    networks:
      - microservices-network


  auth-service:
    image: auth-service:1.1
    container_name: auth-service
    depends_on:
      auth-db:
        condition: service_healthy
    environment:
      OTEL_SERVICE_NAME:
      SPRING_DATASOURCE_URL: ${AUTH_DB_URL}
      SPRING_DATASOURCE_USERNAME: auth
      SPRING_DATASOURCE_PASSWORD: ${AUTH_DB_PASSWORD}
    restart: always
    networks:
      - microservices-network


  api-gateway:
    image: api-gateway:1.1
    container_name: api-gateway
    depends_on:
      - patient-service
      - appointment-service
      - auth-service
    environment:
      OTEL_SERVICE_NAME:
    ports:
      - "9090:9090"
    restart: always
    networks:
      - microservices-network

  notification-service:
    image: notification-service:1.1
    container_name: notification-service
    depends_on:
      template-db:
        condition: service_healthy
      localstack:
        condition: service_started
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://template-db:5432/template_db
      SPRING_DATASOURCE_USERNAME: template
      SPRING_DATASOURCE_PASSWORD: template123

      SPRING_CLOUD_AWS_REGION_STATIC: us-east-1
      SPRING_CLOUD_AWS_CREDENTIALS_ACCESS_KEY: test
      SPRING_CLOUD_AWS_CREDENTIALS_SECRET_KEY: test

      SPRING_CLOUD_AWS_SQS_ENDPOINT: http://localstack:4566
      SPRING_CLOUD_AWS_SNS_ENDPOINT: http://localstack:4566

    ports:
      - "8084:8084"
    restart: always
    networks:
      - microservices-network

  tempo:
    image: grafana/tempo:2.4.1
    container_name: tempo
    command: [ "-config.file=/etc/tempo.yaml" ]
    volumes:
      - ./tempo/tempo.yaml:/etc/tempo.yaml
    ports:
      - "3200:3200"
      - "4318:4318"
    networks:
      - microservices-network


volumes:
  patient_mysql_data:
  appointment_mysql_data:
  auth_postgres_data:
  template_postgres_data:


networks:
  microservices-network:
    driver: bridge