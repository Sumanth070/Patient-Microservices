global:
  scrape_interval: 10s

scrape_configs:

  - job_name: patient-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['patient-service:8080']

  - job_name: appointment-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['appointment-service:8081']

  - job_name: auth-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['auth-service:8082']

  - job_name: api-gateway
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['api-gateway:9090']